<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>内容已移除</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f5f5f4;
      color: #292524;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
    }

    p {
      margin: 0;
      color: #78716c;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1917;
        color: #fafaf9;
      }

      p {
        color: #a8a29e;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>内容已移除</h1>
    <p>这个博客已停止维护。</p>
  </main>
</body>
</html>
